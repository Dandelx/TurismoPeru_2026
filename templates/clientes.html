<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Turismo Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Sistema Turismo Perú</h2>
        
        <div class="mb-3">
            <a href="/nuevo" class="btn btn-success">Registrar Cliente</a>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tipo cliente</th>
                    <th>Nombres</th>
                    <th>APaterno</th>
                    <th>AMaterno</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente[0] }}</td>
                    <td>{{ cliente[1] }}</td>
                    <td>{{ cliente[2] }}</td>
                    <td>{{ cliente[3] }}</td>
                    <td>{{ cliente[4] }}</td>
                    <td>{{ cliente[5] }}</td>
                    <td>
                        <a href="/editar/{{ cliente[0] }}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="/eliminar/{{ cliente[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar Cliente?')">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
